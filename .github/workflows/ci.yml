name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, core tests, and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check syntax and dependencies
        run: |
          node --check web/app.js
          python -m compileall -q app
          python -m pip check

      - name: Install Chromium and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          python -m playwright install --with-deps chromium

      - name: Run core tests
        run: python -m unittest discover -s tests -p "test_core.py"

      - name: Start isolated local service
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8877 > app.log 2>&1 &
          echo $! > app.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8877/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat app.log
          exit 1

      - name: Run non-writing browser regression
        run: |
          python tests/e2e_tailored_resume.py
          python tests/e2e_jd_clipboard.py
          python tests/e2e_next_optimizations.py
          python tests/e2e_visual_layout.py
          python tests/e2e_onboarding.py

      - name: Show service log on failure
        if: failure()
        run: cat app.log || true

      - name: Stop local service
        if: always()
        shell: bash
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
